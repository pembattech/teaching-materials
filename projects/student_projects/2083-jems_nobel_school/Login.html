<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nobel Academy</title>

    <style>
        body{
            margin:0;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:15px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:blue;
        }

        .user{
            width:100%;
            padding:12px;
            margin:10px ;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        p{
            width:100%;
            padding:12px;
            background:#003366;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        p:hover{
            background:#0055aa;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Student Login</h2>

    <input class="user" type="text" placeholder="Username">

    <input class="user" type="password" placeholder="Password">

    <p>Login</p>
</div>

</body>
</html>
